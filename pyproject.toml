[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "silica-lang"
version = "0.4.0"
description = "SILICA: a tool-agnostic programming language that makes agentic physical chip design deterministic"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Fidel Makatia" }]
requires-python = ">=3.9"
keywords = ["eda", "chip-design", "layout", "gds", "llm-agents", "dsl", "asic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Interpreters",
]

[project.urls]
Homepage = "https://github.com/fidel-makatia/SILICA"
Documentation = "https://github.com/fidel-makatia/SILICA/blob/main/docs/ARCHITECTURE.md"
Issues = "https://github.com/fidel-makatia/SILICA/issues"

[project.optional-dependencies]
klayout = ["klayout"]

[project.scripts]
silica = "silica.cli:main"

[tool.setuptools]
packages = ["silica", "silica.backends"]
